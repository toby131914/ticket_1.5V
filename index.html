<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>搶票系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #e8192c; --red-glow: rgba(232,25,44,0.25);
      --bg: #080809; --s1: #0f0f11; --s2: #161619;
      --border: rgba(255,255,255,0.07); --text: #f0f0f0; --muted: #52525c;
      --green: #22c55e; --yellow: #fbbf24; --blue: #60a5fa;
      --mono: 'JetBrains Mono', monospace;
      --display: 'Bebas Neue', cursive;
      --sans: 'Noto Sans TC', sans-serif;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Grid bg */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none; z-index: 0;
    }

    .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 0 16px 0; }

    /* Hero */
    .hero { text-align: center; padding: 52px 0 36px; position: relative; }
    .hero::after {
      content: '';
      position: absolute; bottom: -20px; left: 50%;
      transform: translateX(-50%);
      width: 300px; height: 100px;
      background: radial-gradient(ellipse, rgba(232,25,44,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-tag {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.25em; color: var(--red);
      margin-bottom: 14px; text-transform: uppercase;
    }
    .hero-tag::before, .hero-tag::after { content: ''; display: block; width: 20px; height: 1px; background: var(--red); }
    .hero h1 { font-family: var(--display); font-size: clamp(64px, 16vw, 90px); letter-spacing: 0.04em; line-height: 0.88; color: #fff; }
    .hero h1 b { color: var(--red); font-weight: 400; }
    .hero p { margin-top: 12px; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }

    /* Cards */
    .cards { display: flex; flex-direction: column; gap: 14px; margin-top: 24px; }

    .card {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px;
      animation: up 0.5s ease both;
    }
    .card:nth-child(1) { animation-delay: 0.00s; }
    .card:nth-child(2) { animation-delay: 0.06s; }
    .card:nth-child(3) { animation-delay: 0.12s; }
    .card:nth-child(4) { animation-delay: 0.18s; }

    @keyframes up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

    .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .badge {
      width: 26px; height: 26px; background: var(--red); border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    .card-head h2 { font-family: var(--mono); font-size: 11px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; }

    /* Fields */
    .field { margin-bottom: 13px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size: 11px; font-family: var(--mono); color: var(--muted); letter-spacing: 0.08em; margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 14px;
      background: var(--s2); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text);
      font-family: var(--sans); font-size: 14px;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(232,25,44,0.08); }
    input::placeholder { color: #252530; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Time */
    .time-row { display: flex; align-items: center; gap: 6px; }
    .time-row select {
      flex: 1; padding: 11px 4px;
      background: var(--s2); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text);
      font-family: var(--mono); font-size: 20px; font-weight: 700;
      text-align: center; appearance: none; outline: none; cursor: pointer;
    }
    .time-row select:focus { border-color: var(--red); }
    .colon { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--red); flex-shrink: 0; }

    /* Login btn */
    .btn-login {
      width: 100%; padding: 12px 16px;
      background: var(--s2); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text);
      font-family: var(--sans); font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-login:hover { border-color: rgba(255,255,255,0.18); background: #1c1c22; }

    /* Start btn */
    #startBtn {
      width: 100%; padding: 16px;
      background: var(--red); border: none; border-radius: 10px;
      color: #fff; font-family: var(--display); font-size: 22px;
      letter-spacing: 0.08em; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 28px var(--red-glow);
    }
    #startBtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 40px var(--red-glow); }
    #startBtn:disabled { background: #1e1e22; color: var(--muted); box-shadow: none; cursor: not-allowed; }

    /* Status */
    #statusBox {
      display: none; margin-top: 12px; padding: 13px 16px;
      border-radius: 9px; font-family: var(--mono); font-size: 12px;
      border: 1px solid transparent; align-items: center; gap: 10px;
    }
    #statusBox.show { display: flex; }
    #statusBox.waiting  { background: rgba(251,191,36,0.07); border-color: rgba(251,191,36,0.25); color: var(--yellow); }
    #statusBox.retrying { background: rgba(251,191,36,0.07); border-color: rgba(251,191,36,0.25); color: var(--yellow); }
    #statusBox.loading  { background: rgba(96,165,250,0.07); border-color: rgba(96,165,250,0.25); color: var(--blue); }
    #statusBox.filling  { background: rgba(96,165,250,0.07); border-color: rgba(96,165,250,0.25); color: var(--blue); }
    #statusBox.done     { background: rgba(34,197,94,0.07);  border-color: rgba(34,197,94,0.25);  color: var(--green); }
    #statusBox.error    { background: rgba(232,25,44,0.07);  border-color: rgba(232,25,44,0.25);  color: #f87171; }
    #statusBox.starting { background: rgba(167,139,250,0.07);border-color: rgba(167,139,250,0.25);color: #a78bfa; }

    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; animation: blink 1s infinite; }
    .done .dot, .error .dot { animation: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* Toast */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--s2); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 20px;
      font-size: 13px; opacity: 0; pointer-events: none;
      transition: all 0.25s; white-space: nowrap; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="hero-tag">Local · Selenium</div>
    <h1>搶<b>票</b><br>系統</h1>
    <p>自動填寫 · 任何表單通用 · 不需要 entry ID</p>
  </div>

  <div class="cards">

    <!-- Step 1: Login -->
    <div class="card">
      <div class="card-head"><div class="badge">01</div><h2>登入 Google 帳號</h2></div>
      <button class="btn-login" onclick="doLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        開啟 Chrome 進行 Google 登入
      </button>
    </div>

    <!-- Step 2: Form -->
    <div class="card">
      <div class="card-head"><div class="badge">02</div><h2>表單設定</h2></div>
      <div class="field">
        <label>表單網址</label>
        <input type="url" id="url" placeholder="https://docs.google.com/forms/d/..."/>
      </div>
      <div class="field">
        <label>搶票時間</label>
        <div class="time-row" id="timePicker"></div>
      </div>
    </div>

    <!-- Step 3: Info -->
    <div class="card">
      <div class="card-head"><div class="badge">03</div><h2>填寫資訊</h2></div>
      <div class="grid2">
        <div class="field">
          <label>姓名</label>
          <input type="text" id="name" placeholder="真實姓名"/>
        </div>
        <div class="field">
          <label>暱稱／代號</label>
          <input type="text" id="nick" placeholder="ID"/>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>電話</label>
          <input type="tel" id="phone" placeholder="09xxxxxxxx"/>
        </div>
        <div class="field">
          <label>電子郵件</label>
          <input type="email" id="email" placeholder="you@gmail.com"/>
        </div>
      </div>
      <div class="field" style="margin-top:4px;">
        <label>指名選項（無則留空）</label>
        <input type="text" id="key" placeholder="例：A區 / VIP / 特定名稱"/>
      </div>
    </div>

    <!-- Step 4: Launch -->
    <div class="card">
      <div class="card-head"><div class="badge">04</div><h2>啟動</h2></div>
      <button id="startBtn" onclick="doStart()">🎯 啟動搶票</button>
      <div id="statusBox">
        <span class="dot"></span>
        <span id="statusText"></span>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── Time picker ──
  const tp = document.getElementById('timePicker');
  [['hour',24,'20'],['min',60,'00'],['sec',60,'00']].forEach(([id,max,def],i) => {
    if (i>0) { const c=document.createElement('span'); c.className='colon'; c.textContent=':'; tp.appendChild(c); }
    const s = document.createElement('select'); s.id = id;
    for (let n=0; n<max; n++) {
      const o = document.createElement('option');
      o.value = o.textContent = String(n).padStart(2,'0');
      if (o.value===def) o.selected=true;
      s.appendChild(o);
    }
    tp.appendChild(s);
  });

  // ── Toast ──
  function toast(msg, ms=2800) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), ms);
  }

  // ── Status ──
  function setStatus(state, msg) {
    const box = document.getElementById('statusBox');
    box.className = 'show ' + state;
    document.getElementById('statusText').textContent = msg;
    if (state==='done' || state==='error') {
      clearInterval(pollTimer);
      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = '🎯 啟動搶票';
    }
  }

  // ── Login ──
  async function doLogin() {
    toast('正在開啟 Chrome...');
    try {
      const r = await fetch('http://127.0.0.1:5000/api/login', { method: 'POST' });
      const d = await r.json();
      toast(d.message, 4000);
    } catch {
      toast('⚠️ 無法連線後端，請先執行 app.py');
    }
  }

  // ── Start ──
  async function doStart() {
    const url = document.getElementById('url').value.trim();
    if (!url) { toast('⚠️ 請輸入表單網址'); return; }

    const payload = {
      url,
      time: `${document.getElementById('hour').value}:${document.getElementById('min').value}:${document.getElementById('sec').value}`,
      name:  document.getElementById('name').value.trim(),
      nick:  document.getElementById('nick').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim(),
      key:   document.getElementById('key').value.trim()
    };

    document.getElementById('startBtn').disabled = true;
    document.getElementById('startBtn').textContent = '啟動中...';
    setStatus('starting', '啟動中...');

    try {
      const r = await fetch('http://127.0.0.1:5000/api/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const d = await r.json();
      if (!d.success) {
        toast('❌ ' + d.message);
        document.getElementById('startBtn').disabled = false;
        return;
      }
      pollStatus();
    } catch {
      toast('⚠️ 無法連線後端，請先執行 app.py');
      document.getElementById('startBtn').disabled = false;
    }
  }

  // ── Poll status ──
  let pollTimer;
  function pollStatus() {
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try {
        const r = await fetch('http://127.0.0.1:5000/api/status');
        const d = await r.json();
        setStatus(d.state, d.message);
      } catch {}
    }, 300);
  }
</script>
</body>
</html>
